# Free Configuration for Testing
free_models:
  # Option 1: Google Gemini (Free, most capable)
  gemini:
    model: "gemini-pro"
    requires_api_key: true
    signup_url: "https://makersuite.google.com/app/apikey"
    free_tier: "60 requests per minute"
    
  # Option 2: Hugging Face Inference API (Free, many models)
  huggingface:
    models:
      - "mistralai/Mistral-7B-Instruct-v0.1"
      - "meta-llama/Llama-2-7b-chat-hf"
      - "tiiuae/falcon-7b-instruct"
      - "google/flan-t5-large"
    requires_api_key: true
    signup_url: "https://huggingface.co/settings/tokens"
    free_tier: "Rate limited, but free"
    
  # Option 3: Mock Server (No API key, for testing)
  mock:
    model: "mock"
    requires_api_key: false
    free_tier: "Unlimited, deterministic responses"

# Attack settings for free testing
attack_settings:
  iterations_per_question: 10  # Reduced for free tier
  max_questions: 20            # Reduced for free tier
  parallel_workers: 2          # Limit to avoid rate limiting
  retry_on_failure: true
  max_retries: 3
  retry_delay: 5               # Seconds

# Evaluation settings
evaluation:
  roberta_threshold: 0.7
  fallback_heuristic: true  # Use free heuristic when RoBERTa unavailable